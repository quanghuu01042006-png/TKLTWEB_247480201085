<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nam = Number(prompt("4"));
        document.write("Nam ")
        switch (nam) {
        case 1: document.write("Học đại cương"); break;
        case 2: document.write("Học cơ sở ngành"); break;
        case 3: document.write("Học chuyên ngành"); break;
        case 4: document.write("Làm khóa luận"); break;
        default : document.write("Ra trường");
        }
    </script>
</body>
</html>
