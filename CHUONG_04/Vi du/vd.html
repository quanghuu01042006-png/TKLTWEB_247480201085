<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm Tra Xếp Loại Học Tập</title>
  </head>
  <body>
    <h2>Chương Trình Tra Cứu Xếp Loại</h2>

    <div class="form-group">
      <label for="nhap_diem">Điểm số:</label>
      <input
        type="number"
        id="nhap_diem"
        min="0"
        max="10"
        step="0.1"
        placeholder="Nhập điểm số (0 - 10)"
      />
    </div>

    <button onclick="tinhDiem()">Xem Xếp Loại</button>

    <div class="result" id="ketQua"></div>

    <script>
      function tinhDiem() {
        // 1. LẤY DỮ LIỆU NHẬP VÀO
        let diem = parseFloat(document.getElementById("nhap_diem").value);

        // Kiểm tra xem người dùng đã nhập đủ và đúng điểm chưa
        if (isNaN(diem) || diem < 0 || diem > 10) {
          document.getElementById("ketQua").innerHTML =
            "<span style='color: red;'>Vui lòng nhập điểm hợp lệ (từ 0 đến 10)!</span>";
          return;
        }

        // 2. XẾP LOẠI HỌC LỰC
        let xepLoai = "";
        if (diem >= 8.0) {
          xepLoai = "Giỏi";
        } else if (diem >= 6.5) {
          xepLoai = "Khá";
        } else if (diem >= 5.0) {
          xepLoai = "Trung bình";
        } else {
          xepLoai = "Yếu";
        }

        // 3. IN ĐIỂM RA MÀN HÌNH HTML
        document.getElementById("ketQua").innerHTML = `
          <p>Điểm của bạn: <strong>${diem}</strong></p>
          <p>Xếp loại: <strong>${xepLoai}</strong></p>
        `;
      }
    </script>
  </body>
</html>
