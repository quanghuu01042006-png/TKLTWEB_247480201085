<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script language="JavaScript">
      var d = new Date();
      var ngay = d.getDate(); 
      var thang = d.getMonth() + 1; 
      var nam = d.getFullYear(); 
      document.write(
        "<h3>Hôm nay là: Ngày " +
          ngay +
          " tháng " +
          thang +
          " năm " +
          nam +
          "</h3>",
      );
    </script>
  </body>
</html>
