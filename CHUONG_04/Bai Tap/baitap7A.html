<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script language="JavaScript">
      var D = new Date();
      var NamSinh, NamHienTai;
      NamHienTai = D.getFullYear();
      do {
        NamSinh = prompt("Bạn sinh năm bao nhiêu : ", "");
        NamSinh = parseInt(NamSinh); 
      } while (isNaN(NamSinh) || NamSinh > NamHienTai); 
      var Tuoi = NamHienTai - NamSinh;
      alert("Tuổi của bạn bây giờ là : " + Tuoi);
    </script>
  </body>
</html>
