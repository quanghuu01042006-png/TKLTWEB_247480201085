<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <HTML>
<HEAD>
    <TITLE>Đọc giá trị trong hộp text</TITLE>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</HEAD>
<BODY>
    <h2>Hãy gõ văn bản vào các hộp text và click vào nút Hiển thị</h2>
    
    <!-- Hộp text 1: Nhập Họ -->
    Họ: <INPUT type="text" id="Ho" name="Ho">
    <br><br>
    
    <!-- Hộp text 2: Nhập Tên -->
    Tên: <INPUT type="text" id="Ten" name="Ten">
    <br><br>
    
    <!-- Nút nhấn: Hiển thị kết quả -->
    <INPUT type="button" name="HienThi" value="Hiển thị" 
    onClick="HienThiThongTin()">

    <script language="JavaScript">
        function HienThiThongTin() {
            // Lấy giá trị từ 2 hộp text
            var ho = document.getElementById("Ho").value;
            var ten = document.getElementById("Ten").value;
            
            // Gộp họ và tên lại thành chuỗi họ tên đầy đủ
            var hoTenDayDu = ho + " " + ten;
            
            // Hiển thị ra màn hình bằng alert
            alert("Họ và tên: " + hoTenDayDu);
        }
    </script>
</BODY>
</HTML>
