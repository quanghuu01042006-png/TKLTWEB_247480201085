<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <HTML>
<HEAD>
    <TITLE>Bài tập 14A - Tính toán số học</TITLE>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
</HEAD>
<BODY>
    <h2>Hãy nhập hai số và chọn phép tính</h2>
    
    <!-- Hộp text nhập số hạng 1 -->
    Số hạng 1: <INPUT type="text" name="SoHang1" id="SoHang1">
    <br><br>
    <!-- Hộp text nhập số hạng 2 -->
    Số hạng 2: <INPUT type="text" name="SoHang2" id="SoHang2">
    <br><br>
    <!-- Hộp text hiển thị kết quả -->
    Kết quả: <INPUT type="text" name="KetQua" id="KetQua">
    <br><br>
    <!-- Các nút thực hiện phép tính -->
    <INPUT type="button" name="Cong" value="Cộng" onclick="TinhToan('cong')">
    <INPUT type="button" name="Tru" value="Trừ" onclick="TinhToan('tru')">
    <INPUT type="button" name="Nhan" value="Nhân" onclick="TinhToan('nhan')">
    <INPUT type="button" name="Chia" value="Chia" onclick="TinhToan('chia')">
    <script language="JavaScript">
        function TinhToan(phepTinh) {
            // Lấy giá trị từ 2 hộp text và chuyển sang dạng số
            var so1 = parseFloat(document.getElementById("SoHang1").value);
            var so2 = parseFloat(document.getElementById("SoHang2").value);
            var ketQua = 0;
            // Kiểm tra nếu người dùng chưa nhập số hoặc nhập sai định dạng
            if (isNaN(so1) || isNaN(so2)) {
                alert("Vui lòng nhập đúng định dạng số!");
                return;
            }
            // Thực hiện phép tính dựa vào tham số truyền vào
            switch (phepTinh) {
                case 'cong':
                    ketQua = so1 + so2;
                    break;
                case 'tru':
                    ketQua = so1 - so2;
                    break;
                case 'nhan':
                    ketQua = so1 * so2;
                    break;
                case 'chia':
                    // Kiểm tra chia cho 0
                    if (so2 === 0) {
                        alert("Không thể chia cho 0!");
                        return;
                    }
                    ketQua = so1 / so2;
                    break;
            }
            // Gán kết quả vào hộp text KetQua
            document.getElementById("KetQua").value = ketQua;
        }
    </script>
</BODY>
</HTML>
