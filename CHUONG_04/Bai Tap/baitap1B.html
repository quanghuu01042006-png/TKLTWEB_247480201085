<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var hoten = prompt("Nhập vào họ tên sinh viên:", "");
      var lop = prompt("Nhập vào lớp học:", "");

      document.write("<h1 style='color: red;'>TRƯỜNG ĐẠI HỌC BẠC LIÊU</h1>");
      document.write("<h2 style='color: blue;'>KHOA CÔNG NGHỆ THÔNG TIN</h2>");
      document.write(
        "<font size='4' color='black'><b>Lớp học: " + lop + "</b></font><br>",
      );
      document.write(
        "<font size='4' color='green'>Họ tên sinh viên: " + hoten + "</font>",
      );
    </script>
  </body>
</html>
