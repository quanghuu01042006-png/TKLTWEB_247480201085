<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var ten, tuoi; //khai báo 2 biến để lưu tên và tuổi
      ten = prompt("ban hay nhap vao ten ", "");
      tuoi = prompt("ban hay nhap vao tuoi : ", 20);
      document.write("chao ban :<B>" + ten + "</B>");
      document.write("<br>"); // xuống dòng
      document.write("tuổi cảu bạn là : <U> " + tuoi + "</U>");
    </script>
  </body>
</html>
