<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu trúc Do...While</title>
</head>
<body>
    <script>
        x = 10;
        do 
        {
            document.write(x) ;
            x--;
        } while(x>0)
    </script>
</body>
</html>
