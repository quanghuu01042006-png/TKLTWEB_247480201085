<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu trúc IF</title>
</head>
<body>
    <script>
        document.write("In ra màng hình");
        var diem, xeploai;
        diem = 2;
        if(diem >= 8.5){
            xeploai = "Giỏi"
            document.write("<br>")
            document.write(xeploai);
        }
         else if(diem >= 7){
            xeploai = "Khá"
            document.write("<br>")
            document.write(xeploai);
         }
         else if(diem >= 5){
            xeploai = "Trung Bình"
            document.write("<br>")
            document.write(xeploai);
         }
         else {
            xeploai = "Yếu"
            document.write("<br>")
            document.write(xeploai);
        }
        
    </script>
</body>
</html>
